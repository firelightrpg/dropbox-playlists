[tool.poetry]
name = "dropbox-playlists"
version = "0.1.0"
description = "Automated video game music categorization and playlist management for tabletop gaming"
authors = ["wyrmwood"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
dropbox = "^12.0.2"
mutagen = "^1.47.0"
python-dotenv = "^1.0.1"
librosa = "~0.10.2"
fastapi = "~0.115.8"
uvicorn = "~0.34.0"
websockets = "^15.0"
selenium = "^4.28.1"
ytmusicapi = "^1.10.1"
yt-dlp = "^2024.0.0"

[tool.poetry.group.dev.dependencies]
black = "^24.4.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py312']
